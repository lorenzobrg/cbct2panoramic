[project]
name = "cbct2panoramic"
version = "3.0.0"
description = "GPU-accelerated CBCT -> panoramic (OPG) reconstruction"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "nibabel>=5.2",
    "scikit-image>=0.24",
    "Pillow>=10.0",
]
# NOTE: `torch` is a hard runtime requirement but is intentionally NOT pinned
# here — its wheel is hardware-specific (ROCm / CUDA / CPU) and must be installed
# from the matching PyTorch index. See README "Install". e.g.:
#   uv pip install --pre torch --index-url https://download.pytorch.org/whl/nightly/rocm7.2

[project.optional-dependencies]
# Debug plots only.
debug = ["matplotlib>=3.8"]

[project.scripts]
cbct-panorama = "cbct_panorama:main"

[tool.uv]
# torch wheels are pulled from a hardware-specific index; see README.
# Default (below) targets AMD ROCm. For NVIDIA/CPU, override the index at
# install time (documented in README) or edit [tool.uv.sources].

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
py-modules = ["cbct_panorama", "run_local_cases"]
